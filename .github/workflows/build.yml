name: Mod bauen

# Baut die TimingUp-Mod online (nach dem Vorbild des offiziellen SML-Builds).
# Benötigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   UE_GH_TOKEN     GitHub-Token (classic, Scope "repo") eines Accounts, der über
#                   linker.ficsit.app Zugriff auf die Satisfactory-Unreal-Engine hat
#   WWISE_EMAIL     E-Mail eines (kostenlosen) Audiokinetic-Kontos
#   WWISE_PASSWORD  Passwort dazu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Source/**"
      - "TimingUp.uplugin"
      - ".github/workflows/build.yml"

env:
  # Muss zur Engine- und Wwise-Version unten passen (beides wie im aktuellen SML-master-Build)
  SML_VERSION: master
  WORK: /mnt/work

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Secrets prüfen
        env:
          UE_GH_TOKEN: ${{ secrets.UE_GH_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
        run: |
          if [ -z "$UE_GH_TOKEN" ] || [ -z "$WWISE_EMAIL" ]; then
            echo "::error title=Secrets fehlen::Bitte UE_GH_TOKEN, WWISE_EMAIL und WWISE_PASSWORD als Repository-Secrets anlegen (siehe README)."
            exit 1
          fi

      - name: Speicherplatz freimachen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          sudo mkdir -p $WORK && sudo chown $USER $WORK
          df -h / /mnt

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y wget build-essential zstd dos2unix msitools perl \
            gcc-multilib gcc-mingw-w64 libasound2-dev libpulse-dev libdbus-1-dev libfontconfig-dev \
            libfreetype-dev libgnutls28-dev libgl-dev libunwind-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev libxext-dev \
            libwayland-bin libwayland-dev libegl-dev libxkbcommon-dev libxkbregistry-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libosmesa6-dev libsdl2-dev \
            libudev-dev libvulkan-dev flex bison

      - name: Wine-Cache
        id: wine-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/../wine-build
          key: wine-11.0-typelib-v1

      - name: Wine bauen/installieren
        run: |
          WINE_DIR="$RUNNER_TEMP/../wine-build"
          if [ ! -f "$WINE_DIR/build/.done" ]; then
            rm -rf "$WINE_DIR"
            git clone --depth 1 -b wine-11.0 https://gitlab.winehq.org/wine/wine.git "$WINE_DIR"
            cd "$WINE_DIR"
            wget -O typelib.patch https://gitlab.winehq.org/wine/wine/-/merge_requests/9640.patch
            git -c user.email=ci@example.com -c user.name=CI am typelib.patch
            mkdir build && cd build
            ../configure --enable-archs=x86_64,i386 --without-tests
            make -j$(nproc)
            touch .done
          fi
          cd "$WINE_DIR/build" && sudo make install
          echo "WINEPREFIX=$RUNNER_TEMP/.wine" >> $GITHUB_ENV
          echo "WINEDEBUG=-all" >> $GITHUB_ENV
          export WINEPREFIX="$RUNNER_TEMP/.wine"
          mkdir -p $WINEPREFIX
          WINEDLLOVERRIDES="mscoree,mshtml=" wineboot -u
          wineserver -w

      - name: MSVC-Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK }}/msvc
          key: msvc-17.8-sdk22621-v1

      - name: MSVC einrichten
        run: |
          MSVC_DIR="$WORK/msvc"
          git clone --depth 1 -b ue-patches https://github.com/mircearoata/msvc-wine.git $RUNNER_TEMP/msvc-wine
          if [ ! -f $MSVC_DIR/.installed ]; then
            $RUNNER_TEMP/msvc-wine/vsdownload.py --dest $MSVC_DIR --cache $RUNNER_TEMP/msvc-download \
              --accept-license --channel release.ltsc.17.8 --msvc-version 17.8 --sdk-version 10.0.22621 \
              Microsoft.Net.4.8.SDK Microsoft.VisualStudio.MinShell
            wget -q -P $RUNNER_TEMP/msvc-download https://github.com/kbandla/installers/releases/latest/download/X64.Debuggers.And.Tools-x64_en-us.msi
            msiextract -C $MSVC_DIR $RUNNER_TEMP/msvc-download/X64.Debuggers.And.Tools-x64_en-us.msi > /dev/null
            $RUNNER_TEMP/msvc-wine/install.sh $MSVC_DIR
            printf '#!/usr/bin/env bash\n. "$(dirname "$0")"/msvcenv.sh\nSDKDEBUGBINDIR="$SDKBASE/Debuggers/x64"\n"$(dirname "$0")"/wine-msvc.sh "$SDKDEBUGBINDIR/pdbcopy.exe" "$@"\n' > $MSVC_DIR/bin/x64/pdbcopy
            ln -sf ./pdbcopy $MSVC_DIR/bin/x64/pdbcopy.exe
            chmod +x $MSVC_DIR/bin/x64/pdbcopy*
            rm -rf $RUNNER_TEMP/msvc-download
            touch $MSVC_DIR/.installed
          fi
          echo "UE_WINE_MSVC=$(realpath $MSVC_DIR)" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          path: TimingUp

      - name: SML-Projekt holen und Mod einfügen
        run: |
          git clone --depth 1 -b $SML_VERSION https://github.com/satisfactorymodding/SatisfactoryModLoader.git $WORK/SML
          mkdir -p $WORK/SML/Mods/TimingUp
          cp -r "$GITHUB_WORKSPACE/TimingUp/." $WORK/SML/Mods/TimingUp/
          rm -rf $WORK/SML/Mods/TimingUp/.git $WORK/SML/Mods/TimingUp/.github

      - name: Unreal Engine (Satisfactory) laden
        working-directory: ${{ env.WORK }}
        env:
          GH_TOKEN: ${{ secrets.UE_GH_TOKEN }}
        run: |
          mkdir -p ue && cd ue
          gh release download --repo satisfactorymodding/UnrealEngine -p "UnrealEngine-CSS-Editor-Linux.tar.zst.*"
          cat UnrealEngine-CSS-Editor-Linux.tar.zst.* | zstd -d | tar -xf -
          rm UnrealEngine-CSS-Editor-Linux.tar.zst.*
          ./Engine/Binaries/Linux/UnrealVersionSelector -register
          df -h /mnt

      - name: Wwise laden
        working-directory: ${{ env.WORK }}
        env:
          GH_TOKEN: ${{ github.token }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          gh release download --repo mircearoata/wwise-cli -p wwise-cli_linux_amd64 -O wwise-cli
          chmod +x ./wwise-cli
          ./wwise-cli download --sdk-version "2025.1.6.9117" --filter Packages=SDK --filter DeploymentPlatforms=Windows_vc160 --filter DeploymentPlatforms=Windows_vc170 --filter DeploymentPlatforms=Linux --filter DeploymentPlatforms= >/dev/null
          ./wwise-cli integrate-ue --integration-version "2025.1.6.4248" --project "$WORK/SML/FactoryGame.uproject" >/dev/null

      - name: Editor bauen
        run: $WORK/ue/Engine/Build/BatchFiles/Linux/Build.sh FactoryEditor Linux Development -project="$WORK/SML/FactoryGame.uproject"

      - name: Mod packen (Windows)
        run: |
          ulimit -n 1048576
          $WORK/ue/Engine/Build/BatchFiles/RunUAT.sh -ScriptsForProject="$WORK/SML/FactoryGame.uproject" PackagePlugin \
            -Project="$WORK/SML/FactoryGame.uproject" -dlcname=TimingUp -merge -build \
            -clientconfig=Shipping -platform=Win64 -nocompileeditor -installed

      - name: Mod hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TimingUp-Windows
          path: ${{ env.WORK }}/SML/Saved/ArchivedPlugins/TimingUp/*.zip
